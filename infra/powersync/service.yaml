# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@1.28.3/json-schema/powersync-config.json
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: 8080

sync_config:
  path: sync-config.yaml

client_auth:
  jwks_uri: !env PS_JWKS_URL
  # The app server is on a private address in development and CI.
  block_local_jwks: false
  audience: ["powersync"]

telemetry:
  disable_telemetry_sharing: true

system:
  logging:
    level: info
