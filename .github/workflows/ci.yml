name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server and application harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres
      - run: pnpm typecheck
      - run: pnpm test

  web-e2e:
    name: Web client end to end
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @salamifocus/e2e exec playwright install --with-deps chromium
      - run: docker compose up -d --wait
      - run: pnpm test:e2e:web
      - if: failure()
        run: docker compose logs powersync
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report

  android-e2e:
    name: Android client end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - name: Start the app server and a network switch in front of it
        run: |
          HOST=0.0.0.0 nohup node --env-file=.env server/src/main.ts > server.log 2>&1 &
          nohup node e2e/support/network-switch.ts --listen 3199 --control 3198 --target http://127.0.0.1:3100 > switch.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:3100/api/health && curl -sf http://127.0.0.1:3198/; do sleep 1; done'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: >-
            ./gradlew --console=plain connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://10.0.2.2:3199
            -Pandroid.testInstrumentationRunnerArguments.directServerUrl=http://10.0.2.2:3100
            -Pandroid.testInstrumentationRunnerArguments.networkControl=http://10.0.2.2:3198
      - if: failure()
        run: cat server.log; docker compose logs powersync
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/outputs/androidTest-results
