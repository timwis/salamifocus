name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server and application harness
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://salamifocus:salamifocus@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres
      - run: pnpm typecheck
      - run: pnpm test
