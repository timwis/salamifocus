name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server and application harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres
      - run: pnpm typecheck
      - run: pnpm test

  web-e2e:
    name: Web client end to end
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @salamifocus/e2e exec playwright install --with-deps chromium
      - run: docker compose up -d --wait
      - run: pnpm test:e2e:web
      - if: failure()
        run: docker compose logs powersync
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
