# Layered over compose.yaml for end-to-end tests (see e2e/support/stack.ts):
# a separate project per checkout whose Postgres keeps nothing on disk, on
# free ports the runner picks so that it does not clash with development or
# with runs in other checkouts.
services:
  postgres:
    ports: !override
      - "${E2E_POSTGRES_PORT:?set by e2e/support/stack.ts}:5432"
    volumes: !override
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs:
      - /var/lib/postgresql

  powersync:
    ports: !override
      - "${E2E_POWERSYNC_PORT:?set by e2e/support/stack.ts}:8080"
    environment:
      PS_JWKS_URL: http://host.docker.internal:${E2E_SERVER_PORT:?set by e2e/support/stack.ts}/.well-known/jwks.json
